plugins {
    id 'com.android.application' version '8.3.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
    // Google Services plugin (for Firebase). Declared here but only APPLIED in
    // app/build.gradle when app/google-services.json is present, so the build keeps
    // working before Firebase is configured. See .kiro/specs/buddy-link/firebase-setup.md.
    id 'com.google.gms.google-services' version '4.4.2' apply false
}
